name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact healed commit to validate
        type: string
        required: false

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Validate workflow syntax
    permissions:
      contents: read
    # Merge the reusable workflow upstream before adding or renaming this caller.
    uses: moyarich/reusable-workflows/.github/workflows/reusable_actionlint.yml@main

  checks:
    name: Monorepo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Zsh for terminal PTY tests
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - name: Install Glow
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --batch --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update -qq
          sudo apt-get install -y glow
          glow --version
      - run: npm ci --include=optional
      - run: npm run checks
      - run: npm run pack:check
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: echo "## Monorepo checks — $STATUS" >> "$GITHUB_STEP_SUMMARY"
