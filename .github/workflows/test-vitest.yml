name: Vitest

on:
  push:
    branches: [main]
    paths:
      - "packages/zsh-glow/**"
      - "tests/**"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-vitest.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Zsh for terminal PTY tests
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - run: npm ci --include=optional
      - name: Run Vitest suites
        run: npx vitest run
      - name: Upload terminal UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-ui-screenshots
          path: test-results/terminal-screenshots/*.svg
          if-no-files-found: warn
          retention-days: 14
